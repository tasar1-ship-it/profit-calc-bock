<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Gewinnverteilung</title>
<style>
:root { --bg:#f5f7f6; --panel:#ffffff; --ink:#14201c; --ink2:#45524d; --rule:#d9dfdc; --accent:#3730a3; --err:#b3261e; --btn-ink:#ffffff; }
@media (prefers-color-scheme: dark) { :root { --bg:#0f1412; --panel:#161d1a; --ink:#e7ece9; --ink2:#b5c0bb; --rule:#2a3430; --accent:#a5b4fc; --err:#ff8a80; --btn-ink:#0f1412; } }
* { box-sizing:border-box; }
body { margin:0; padding:0 16px; background:var(--bg); color:var(--ink); font-family:-apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size:16px; line-height:1.5; }
.box { max-width:420px; margin:12vh auto 0; padding:28px 24px; background:var(--panel); border:1px solid var(--rule); border-radius:12px; }
h1 { font-family:Georgia, "Times New Roman", serif; font-size:2rem; line-height:1.1; color:var(--accent); margin:0 0 10px; }
p { margin:0 0 18px; color:var(--ink2); }
label { display:block; font-weight:600; margin-bottom:6px; }
input[type=password] { width:100%; font-size:17px; padding:10px 12px; border:1px solid var(--rule); border-radius:8px; background:var(--bg); color:var(--ink); }
.row { display:flex; align-items:center; margin:12px 0 18px; color:var(--ink2); font-size:15px; }
.row input { margin:0 8px 0 0; }
button { width:100%; font-size:17px; font-weight:600; padding:12px; border:0; border-radius:999px; background:var(--accent); color:var(--btn-ink); cursor:pointer; }
#msg { min-height:1.5em; margin:12px 0 0; color:var(--err); font-weight:600; }
</style>
</head>
<body>
<form class="box" id="f" autocomplete="off">
<h1>Gewinnverteilung</h1>
<p>Diese Seite ist geschützt. Bitte geben Sie das erhaltene Passwort ein.</p>
<label for="pw">Passwort</label>
<input type="password" id="pw" autocomplete="current-password" autofocus>
<div class="row"><input type="checkbox" id="rem" checked><label for="rem" style="display:inline;font-weight:400;margin:0">Auf diesem Gerät merken</label></div>
<button type="submit" id="go">Öffnen</button>
<div id="msg" role="alert"></div>
</form>
